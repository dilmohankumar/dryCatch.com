server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for the same reason Phase 19 added compression on the API side —
    # text assets (JS/CSS/HTML) compress well, images/fonts already don't.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (Vite appends a content hash to every filename)
    # are safe to cache forever — a content change produces a new filename,
    # never a stale cache (rule #51's "immutable caching").
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached long — it's what references
    # the current hashed asset filenames after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — any path not matching a real file goes to index.html
    # so React Router's client-side routes (e.g. /account/orders) work on
    # a hard refresh instead of nginx 404ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
